name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate skill packages and eval catalog
        run: python3 scripts/validate.py
      - name: Check whitespace
        run: git diff --check
